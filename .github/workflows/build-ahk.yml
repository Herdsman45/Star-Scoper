name: Build AutoHotkey Script

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download AutoHotkey
        run: |
          Invoke-WebRequest -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.18/AutoHotkey_2.0.18.zip" -OutFile "ahk.zip"
          Expand-Archive -Path "ahk.zip" -DestinationPath "ahk"
      
      - name: Compile AHK Script
        run: |
          .\ahk\Compiler\Ahk2Exe.exe /in discord-integration.ahk /out discord-integration.exe
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: discord-integration-executable
          path: discord-integration.exe
          if-no-files-found: error
          
  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download AutoHotkey
        run: |
          Invoke-WebRequest -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.18/AutoHotkey_2.0.18.zip" -OutFile "ahk.zip"
          Expand-Archive -Path "ahk.zip" -DestinationPath "ahk"
      
      - name: Compile AHK Script
        run: |
          .\ahk\Compiler\Ahk2Exe.exe /in discord-integration.ahk /out discord-integration.exe
        
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: discord-integration-executable
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: discord-integration.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
